name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Rust engine tests ────────────────────────────────────────────────
  test-rust:
    name: Test Rust Engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libsasl2-dev libcurl4-openssl-dev cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: rust-engine
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/logwatch_test
          KAFKA_BROKERS: localhost:9999
          KAFKA_SECURITY_PROTOCOL: PLAINTEXT
          ONNX_MODEL_PATH: ../training/models/isolation_forest.onnx
        run: cargo test

  # ─── Job 2: Spring Boot API tests ───────────────────────────────────────────
  test-spring:
    name: Test Spring Boot API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: spring-api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/logwatch_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-32-chars-minimum-xx
          KAFKA_BOOTSTRAP_SERVERS: localhost:9999
          KAFKA_SECURITY_PROTOCOL: PLAINTEXT
          KAFKA_SASL_MECHANISM: PLAIN
          KAFKA_SASL_JAAS_CONFIG: ""
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: mvn test -B

  # ─── Job 3: Node SDK build ───────────────────────────────────────────────────
  test-sdk:
    name: Build Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install and build
        working-directory: sdk
        run: npm ci && npm run build

  # ─── Job 4: Build and push Docker images ────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: [test-rust, test-spring, test-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rust-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-engine/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logwatch-rust-engine:latest
            ghcr.io/${{ github.repository_owner }}/logwatch-rust-engine:${{ github.sha }}
          cache-from: type=gha,scope=rust-engine
          cache-to: type=gha,mode=max,scope=rust-engine

      - name: Build and push spring-api
        uses: docker/build-push-action@v5
        with:
          context: spring-api
          file: spring-api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logwatch-spring-api:latest
            ghcr.io/${{ github.repository_owner }}/logwatch-spring-api:${{ github.sha }}
          cache-from: type=gha,scope=spring-api
          cache-to: type=gha,mode=max,scope=spring-api

  # ─── Job 5: Deploy via Railway webhook ──────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway redeploy
        run: |
          curl -fSsX POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"sha":"${{ github.sha }}","ref":"${{ github.ref }}"}'
