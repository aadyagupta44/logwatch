global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rust-engine'
    static_configs:
      - targets: ['rust-engine:9090']
    metrics_path: '/metrics'

  - job_name: 'spring-api'
    static_configs:
      - targets: ['spring-api:8080']
    metrics_path: '/actuator/prometheus'
